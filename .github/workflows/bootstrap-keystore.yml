name: Bootstrap Keystore (one-off)

# Run this ONCE from the Actions tab to generate a signing keystore inside the
# runner, then download it from the job artifact. The keystore is never stored
# in the repository: after you have copied it into your GitHub Secrets, delete
# the artifact and this workflow.
#
# Manual run only. There is no push trigger, so it can never fire accidentally.

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias (must match the KEY_ALIAS secret)'
        required: true
        default: 'interview-prep'
      validity_days:
        description: 'Validity in days'
        required: true
        default: '10000'

permissions:
  contents: read

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # A random password is generated per run so it never has to be invented by
      # hand. It is written to the job summary, which is visible only to people
      # with access to this repository's Actions tab.
      - name: Generate keystore
        id: gen
        run: |
          ALIAS="${{ inputs.alias }}"
          VALIDITY="${{ inputs.validity_days }}"
          PASSWORD=$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)

          keytool -genkeypair -v \
            -keystore upload-keystore.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity "$VALIDITY" \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=Gao Yan, OU=Data Engineering, O=Shanghai University, L=Shanghai, C=CN"

          echo "PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

          # base64 of the keystore, ready to paste into the KEYSTORE_BASE64 secret
          base64 -w0 upload-keystore.jks > keystore.b64

      - name: Write setup instructions to job summary
        run: |
          ALIAS="${{ inputs.alias }}"
          {
            echo "## Keystore generated"
            echo ""
            echo "Create the following four repository secrets under"
            echo "**Settings → Secrets and variables → Actions**:"
            echo ""
            echo "| Secret | Value |"
            echo "|---|---|"
            echo "| \`KEY_ALIAS\` | \`$ALIAS\` |"
            echo "| \`KEYSTORE_PASSWORD\` | \`$PASSWORD\` |"
            echo "| \`KEY_PASSWORD\` | \`$PASSWORD\` |"
            echo "| \`KEYSTORE_BASE64\` | see the \`keystore-base64\` artifact |"
            echo ""
            echo "Then delete the artifact and this workflow file."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: keystore.b64
          retention-days: 1

      - name: Upload keystore binary
        uses: actions/upload-artifact@v4
        with:
          name: keystore-file
          path: upload-keystore.jks
          retention-days: 1
