name: Android Debug Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        id: build
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace --no-daemon > "$RUNNER_TEMP/build.log" 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "gradle exit status: $STATUS"
          tail -80 "$RUNNER_TEMP/build.log"
          exit $STATUS

      # On failure, publish the log to a branch so it is readable without
      # downloading artifacts. The log is copied out of the workspace first,
      # because the orphan-branch checkout empties the working tree.
      - name: Publish build log on failure
        if: failure()
        run: |
          cp "$RUNNER_TEMP/build.log" /tmp/build.log
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout --orphan ci_logs_tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          cp /tmp/build.log ./build.log
          git add -A
          git commit -m "build log for run ${{ github.run_number }}"
          git push -f origin ci_logs_tmp:build-logs

      - name: Upload debug APK
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
