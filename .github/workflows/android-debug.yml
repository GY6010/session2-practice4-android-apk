name: Android Debug Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Tee the build output so a failure is debuggable even when the hosted
      # log viewer truncates it.
      - name: Build debug APK
        id: build
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          echo "gradle exit status: $STATUS"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "=== errors ==="
          grep -n -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -60 || true
          exit $STATUS

      # Republish the raw log onto a throwaway branch so it can be read without
      # authentication when the run page truncates it.
      - name: Publish build log
        if: always()
        continue-on-error: true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout --orphan ci_logs_tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          cp "$GITHUB_WORKSPACE/build.log" . 2>/dev/null || true
          ls -la
          git add -A
          git commit -m "build log for run ${{ github.run_number }}"
          git push -f origin ci_logs_tmp:build-logs

      - name: Upload debug APK
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
